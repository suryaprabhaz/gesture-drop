<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gesture Drop{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose"></script>
</head>

<body>
    <div class="container">
        <div class="header">
            <h2>{% block header %}Gesture Drop{% endblock %}</h2>
        </div>

        {% block content %}{% endblock %}

        <div class="footer"
            style="text-align: center; margin-top: 2rem; padding: 1rem; opacity: 0.7; font-size: 0.9rem;">
            <p>Created by <strong>@SuryaPrabhas</strong></p>
        </div>
    </div>

    {% block scripts %}{% endblock %}
</body>

</html>
