{% extends "base.html" %}

{% block title %}Gesture Drop - Mobile{% endblock %}

{% block content %}
<div class="card">
  <h3>Live Content</h3>
  <div id="output">Waiting for gesture...</div>
  <img id="image-preview" src="" alt="Shared Image">
</div>

<div class="card">
  <h3>Recent History</h3>
  <ul id="history-list" class="history-list">
    <!-- Populated by JS -->
    <li class="history-item" style="justify-content: center; color: rgba(255,255,255,0.5);">Loading history...</li>
  </ul>
</div>

<video id="video" autoplay playsinline muted></video>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/mobile.js') }}"></script>
{% endblock %}
